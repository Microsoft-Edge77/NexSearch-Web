<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f17" />
    <title>NexSearch</title>
    <style>
      :root{
        --bg: #0b0f17;
        --bg-2: #111827;
        --panel: rgba(20,27,39,0.88);
        --panel-strong: rgba(17,24,39,0.95);
        --panel-soft: rgba(255,255,255,0.04);
        --text: #edf5ff;
        --muted: #a9b6c8;
        --line: rgba(255,255,255,0.08);
        --accent: #66d9ef;
        --accent-2: #7c9cff;
        --shadow: 0 18px 60px rgba(0,0,0,0.35);
        --radius: 22px;
      }

      :root[data-theme="light"]{
        --bg: #edf3fb;
        --bg-2: #dfeaff;
        --panel: rgba(255,255,255,0.78);
        --panel-strong: rgba(255,255,255,0.94);
        --panel-soft: rgba(14,26,48,0.04);
        --text: #15213d;
        --muted: #485a77;
        --line: rgba(21,33,61,0.08);
        --shadow: 0 14px 36px rgba(70,90,129,0.14);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top, rgba(102,217,239,0.14), transparent 28%),
          linear-gradient(180deg, var(--bg), var(--bg-2));
        color: var(--text);
      }
      body {
        min-height: 100vh;
      }

      a { color: inherit; text-decoration: none; }
      button, input { font: inherit; }
      button { cursor: pointer; }

      .app-shell {
        max-width: 1480px;
        margin: 0 auto;
        padding: 18px 18px 40px;
      }

      .topbar {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr) 160px;
        gap: 16px;
        align-items: center;
        margin-bottom: 18px;
      }

      .brand {
        display: flex; align-items: center; gap: 12px;
        min-width: 0;
        user-select: none;
      }
      .brand-mark {
        width: 42px; height: 42px; border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: grid; place-items: center;
        color: #051118; font-weight: 900;
        box-shadow: var(--shadow);
      }
      .brand-name {
        font-weight: 800; letter-spacing: 0.04em;
      }
      .brand small {
        display: block; color: var(--muted); font-size: 0.72rem;
      }

      .search-wrap {
        position: relative;
      }
      .search-shell {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        display: flex; align-items: center; gap: 12px;
        padding: 10px 12px 10px 16px;
        box-shadow: var(--shadow);
      }
      .search-shell input {
        flex: 1;
        background: transparent; border: none; outline: none;
        color: var(--text); font-size: 1.02rem;
      }
      .search-shell input::placeholder {
        color: var(--muted);
      }
      .search-glass {
        opacity: 0.8; font-size: 1.15rem;
      }
      .search-btn {
        border: none; border-radius: 14px;
        background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 80%, white), color-mix(in srgb, var(--accent-2) 75%, white));
        color: #08151d; font-weight: 800;
        padding: 10px 16px;
      }
      .search-tabs {
        display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
      }
      .tab {
        background: rgba(255,255,255,0.04);
        border: 1px solid transparent;
        color: var(--text);
        border-radius: 10px; padding: 8px 12px;
      }
      .tab.active {
        background: color-mix(in srgb, var(--accent) 26%, transparent);
        border-color: color-mix(in srgb, var(--accent) 50%, transparent);
      }

      .suggestions {
        position: absolute; left: 0; right: 0; top: calc(100% + 8px);
        z-index: 10;
        background: var(--panel-strong);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .suggestion-item {
        display: block; width: 100%; text-align: left;
        background: transparent; border: none; color: var(--text);
        padding: 11px 12px;
      }
      .suggestion-item:hover {
        background: rgba(255,255,255,0.05);
      }

      .top-actions {
        display: flex; justify-content: flex-end;
      }
      .ghost-btn {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 12px;
      }

      .metro-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .home-screen {
        display: grid; gap: 18px;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.6fr 0.8fr;
        gap: 18px;
        padding: 24px 20px;
      }
      .eyebrow {
        color: var(--accent);
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        font-weight: 800;
      }
      .hero h1 {
        margin: 10px 0 10px;
        font-size: clamp(2.1rem, 4vw, 4rem);
        line-height: 1.05;
      }
      .hero p {
        margin: 0; color: var(--muted); max-width: 630px; line-height: 1.6;
      }
      .hero-side {
        display: flex; flex-direction: column; justify-content: center; gap: 12px;
      }
      .mini-stat, .weather-pill {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px 18px;
      }
      .mini-stat span, .weather-pill span{
        color: var(--muted); font-size: 0.74rem;
      }
      .mini-stat strong, .weather-pill strong {
        display: block; margin-top: 5px; font-size: 1.4rem;
      }

      .tile-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(100px, 1fr));
        gap: 18px;
      }
      .tile {
        position: relative;
        min-height: 150px;
        padding: 18px;
        display: flex; flex-direction: column; justify-content: space-between;
        border-radius: 24px;
        border: 1px solid rgba(255,255,255,0.08);
        color: #fff;
        box-shadow: var(--shadow);
        text-align: left;
        background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
        overflow: hidden;
      }
      .tile::before{
        content: "";
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent 35%);
        pointer-events: none;
      }

      .tile.small { grid-column: span 2; }
      .tile.medium { grid-column: span 2; }
      .tile.wide { grid-column: span 3; }
      .tile.large { grid-column: span 4; }

      .tile.accent-cyan { background: linear-gradient(135deg, rgba(102,217,239,0.96), rgba(95,116,255,0.74)); }
      .tile.accent-purple { background: linear-gradient(135deg, rgba(168,85,247,0.92), rgba(96,165,250,0.74)); }
      .tile.accent-amber { background: linear-gradient(135deg, rgba(251,191,36,0.96), rgba(245,158,11,0.72)); }
      .tile.accent-green { background: linear-gradient(135deg, rgba(52,211,153,0.9), rgba(45,212,191,0.76)); }
      .tile.accent-pink { background: linear-gradient(135deg, rgba(244,114,182,0.92), rgba(236,72,153,0.7)); }

      .tile-tag {
        font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
        opacity: 0.9; position: relative; z-index: 1;
      }
      .tile strong {
        font-size: clamp(1.4rem, 2vw, 2.3rem); position: relative; z-index: 1;
      }
      .tile small {
        position: relative; z-index: 1; opacity: 0.92;
      }

      .results-page {
        padding-top: 8px;
      }
      .results-header {
        display: flex; align-items: end; justify-content: space-between; gap: 12px;
        margin-bottom: 18px;
      }
      .results-header h2 {
        margin: 10px 0 0; font-size: clamp(1.8rem, 2vw, 3rem);
      }

      .results-layout {
        display: grid;
        grid-template-columns: minmax(0, 2.2fr) minmax(260px, 1fr);
        gap: 18px;
      }
      .result-card, .ai-panel, .wiki-panel, .sidebar-panel {
        padding: 18px 20px;
      }
      .results-list {
        display: grid; gap: 16px;
      }
      .result-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
      }
      .result-top {
        display: flex; justify-content: space-between; gap: 10px; color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 8px;
      }
      .result-card h3 {
        margin: 0 0 10px; font-size: 1.5rem;
      }
      .result-card p { margin: 0; color: var(--muted); line-height: 1.58; }

      .ai-panel, .wiki-panel, .quick-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
      }
      .ai-body h4 { margin: 12px 0 8px; }
      .ai-body p, .ai-body li { color: var(--muted); line-height: 1.75; }
      .quick-panel ul {
        margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 10px;
      }
      .quick-panel a {
        display: block; color: var(--text); opacity: 0.88;
      }

      .image-grid {
        display: grid; grid-template-columns: repeat(4, minmax(160px,1fr)); gap: 14px;
      }
      .image-card {
        position: relative; overflow: hidden; min-height: 220px;
        border-radius: 18px; border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
      }
      .image-card img {
        display: block; width: 100%; height: 100%; object-fit: cover;
      }
      .image-overlay {
        position: absolute; inset: auto 0 0 0; padding: 14px;
        background: linear-gradient(180deg, transparent, rgba(0,0,0,0.75));
      }
      .image-overlay strong { display: block; font-size: 0.98rem; }
      .image-overlay small { color: rgba(255,255,255,0.8); }

      .news-grid {
        display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 16px;
      }
      .news-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        overflow: hidden; box-shadow: var(--shadow);
      }
      .news-card img { width: 100%; height: 180px; object-fit: cover; display: block; }
      .news-content { padding: 18px; }
      .news-content span {
        color: var(--accent); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.08em; font-weight: 800;
      }
      .news-content h4 { margin: 10px 0 8px; font-size: 1.18rem; }
      .news-content small { color: var(--muted); }
      .news-content p { margin: 10px 0 0; color: var(--muted); line-height: 1.5; }

      .settings-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.35);
        z-index: 50; display: flex; justify-content: flex-end;
      }
      .settings-panel {
        width: min(420px, 92vw); height: 100%;
        background: var(--panel-strong);
        border-left: 1px solid var(--line);
        padding: 18px 18px 28px;
      }
      .settings-header {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;
      }
      .settings-header h3 {
        margin: 8px 0 0; font-size: 1.8rem;
      }
      .close-btn {
        width: 40px; height: 40px; border-radius: 12px;
        background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: var(--text);
      }
      .settings-group { margin-bottom: 18px; }
      .settings-group label { display: block; margin-bottom: 10px; color: var(--muted); }
      .swatches {
        display: flex; gap: 10px; flex-wrap: wrap;
      }
      .swatch {
        width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent;
      }
      .swatch.active {
        border-color: white;
        box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
      }
      .settings-inline {
        display: flex; justify-content: space-between; align-items: center;
      }
      .toggle-btn, .link-btn {
        background: rgba(255,255,255,0.05); border: 1px solid var(--line);
        color: var(--text); border-radius: 12px; padding: 10px 12px;
      }
      .history-list { display: grid; gap: 8px; }
      .history-item {
        display: block; width: 100%; text-align: left; color: var(--text);
        background: rgba(255,255,255,0.04); border: 1px solid var(--line);
        border-radius: 12px; padding: 10px 12px;
      }

      .loader-box {
        min-height: 240px; display: grid; place-items: center;
      }
      .loader {
        width: 52px; height: 52px; border-radius: 50%;
        border: 4px solid rgba(255,255,255,0.12);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 980px){
        .topbar { grid-template-columns: 1fr; }
        .hero { grid-template-columns: 1fr; }
        .results-layout { grid-template-columns: 1fr; }
        .image-grid { grid-template-columns: repeat(2, minmax(140px,1fr)); }
        .news-grid { grid-template-columns: 1fr; }
      }

      @media (max-width: 640px){
        .tile-grid { grid-template-columns: repeat(4, minmax(90px,1fr)); }
        .tile.small, .tile.medium, .tile.wide, .tile.large { grid-column: span 2; }
        .search-shell { flex-wrap: wrap; }
        .search-btn { width: 100%; }
        .image-grid { grid-template-columns: 1fr; }
        .results-header { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      const STORAGE_KEYS = {
        theme: 'nexsearch-theme',
        accent: 'nexsearch-accent',
        ai: 'nexsearch-ai',
        history: 'nexsearch-history'
      };

      const app = document.getElementById('app');

      function readJSON(key, fallback) {
        try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
      }

      function saveJSON(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      const state = {
        search: '',
        type: 'web',
        route: 'home',
        accent: readJSON(STORAGE_KEYS.accent, '#66d9ef'),
        theme: readJSON(STORAGE_KEYS.theme, 'dark'),
        aiEnabled: readJSON(STORAGE_KEYS.ai, true),
        history: readJSON(STORAGE_KEYS.history, []),
        weather: null,
        data: null,
        loading: false,
        settingsOpen: false
      };

      function setAccent(value) {
        state.accent = value;
        saveJSON(STORAGE_KEYS.accent, value);
        document.documentElement.style.setProperty('--accent', value);
      }

      function setTheme(value) {
        state.theme = value;
        saveJSON(STORAGE_KEYS.theme, value);
        document.documentElement.dataset.theme = value;
      }

      function setAI(value) {
        state.aiEnabled = value;
        saveJSON(STORAGE_KEYS.ai, value);
      }

      function pushHistory(query) {
        const clean = String(query || '').trim();
        if (!clean) return;
        state.history = [clean, ...state.history.filter(item => item !== clean)].slice(0, 10);
        saveJSON(STORAGE_KEYS.history, state.history);
      }

      function formatTime(date = new Date()) {
        return new Intl.DateTimeFormat('fr-FR', {
          hour: '2-digit',
          minute: '2-digit'
        }).format(date);
      }

      function safeDomain(url) {
        try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return 'nexsearch'; }
      }

      async function fetchJson(url) {
        try {
          const r = await fetch(url, { headers: { Accept: 'application/json' } });
          if (!r.ok) throw new Error('bad response');
          return await r.json();
        } catch {
          return null;
        }
      }

      async function fetchSuggestions(query) {
        const q = query.trim();
        if (!q) return [];
        const url = `https://duckduckgo.com/ac/?q=${encodeURIComponent(q)}&type=list`;
        const data = await fetchJson(url);
        if (Array.isArray(data)) {
          const items = data.map(x => typeof x === 'string' ? x : x && x.phrase).filter(Boolean);
          return items.slice(0, 6);
        }
        return [];
      }

      async function geoWeather() {
        if (!navigator.geolocation) {
          return { temperature: 19, condition: 'Nuageux', humidity: 60, wind: 12, location: 'Paris' };
        }
        return new Promise((resolve) => {
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`;
                const data = await fetchJson(url);
                if (data && data.current) {
                  const code = Number(data.current.weather_code || 1);
                  const map = {
                    0: 'Dégagé', 1: 'Principalement clair', 2: 'Partiellement nuageux', 3: 'Couvert',
                    45: 'Brouillard', 48: 'Brouillard givrant', 51: 'Bruine légère', 61: 'Pluie modérée',
                    80: 'Averses', 95: 'Orage'
                  };
                  resolve({
                    temperature: Number(data.current.temperature_2m || 19),
                    condition: map[code] || 'Nuageux',
                    humidity: Number(data.current.relative_humidity_2m || 60),
                    wind: Number(data.current.wind_speed_10m || 12),
                    location: 'Votre emplacement'
                  });
                  return;
                }
              } catch {}
              resolve({ temperature: 19, condition: 'Nuageux', humidity: 60, wind: 12, location: 'Paris' });
            },
            () => {
              resolve({ temperature: 19, condition: 'Nuageux', humidity: 60, wind: 12, location: 'Paris' });
            },
            { enableHighAccuracy: true, timeout: 10000 }
          );
        });
      }

      function makeFallbackData(query) {
        return {
          query,
          type: 'web',
          webResults: [
            { title: `${query} — aperçu et références`, url: `https://www.google.com/search?q=${encodeURIComponent(query)}`, snippet: `Résultats synthétiques et références utiles sur ${query}.`, domain: 'google.com', date: 'Aujourd’hui' },
            { title: `Actualités sur ${query}`, url: `https://news.google.com/search?q=${encodeURIComponent(query)}`, snippet: `Les derniers sujets et actualités liées à ${query}.`, domain: 'news.google.com', date: 'Aujourd’hui' },
            { title: `Wikipedia : ${query}`, url: `https://fr.wikipedia.org/wiki/${encodeURIComponent(query)}`, snippet: `Résumé encyclopédique et contexte sur ${query}.`, domain: 'wikipedia.org', date: 'Référence' }
          ],
          aiOverview: `**Aperçu IA**\n\nLe sujet “${query}” dispose d’informations publiques utiles et de références crédibles.\n\n- Contexte général\n- Actualité récente\n- Références clés\n\nLes sources accessibles suggèrent un bon niveau de compréhension, avec plusieurs points d’entrée pour approfondir [1], [2], [3].`,
          wikiSummary: `Le sujet "${query}" est généralement documenté dans les sources publiques et est utile pour comprendre le contexte et les évolutions récentes.`,
          wikiTitle: `Résumé ${query}`,
          newsItems: [
            { title: `À l’instant : ${query}`, link: `https://news.google.com/search?q=${encodeURIComponent(query)}`, source: 'Google News', published: 'Il y a 30 min', description: 'Des informations récentes et pertinentes autour de ce sujet.' },
            { title: `Tendances autour de ${query}`, link: `https://news.google.com/search?q=${encodeURIComponent(query)}`, source: 'Google News', published: 'Il y a 1h', description: 'Un sujet populaire qui reste actif dans les discussions publiques.' }
          ],
          images: Array.from({ length: 8 }, (_, i) => ({
            title: `${query} ${i + 1}`,
            source: 'Public',
            thumbnail: 'https://images.unsplash.com/photo-1518770660439-463ac1d17e82?auto=format&fit=crop&w=900&q=80',
            link: `https://www.bing.com/images/search?q=${encodeURIComponent(query)}`
          })),
          sources: []
        };
      }

      async function searchData(query) {
        const q = String(query || '').trim();
        if (!q) return makeFallbackData('recherche');

        try {
          const [ddg, wiki, news, imgs] = await Promise.all([
            fetchJson(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1&kl=fr-fr`),
            fetchJson(`https://fr.wikipedia.org/w/api.php?action=query&format=json&prop=extracts&exintro=1&explaintext=1&redirects=1&titles=${encodeURIComponent(q)}&origin=*`),
            fetchJson(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(`https://news.google.com/rss/search?q=${q}&hl=fr&gl=FR&ceid=FR:fr`)}`),
            fetchJson(`https://duckduckgo.com/i.js?q=${encodeURIComponent(q)}&l=fr-fr&o=json`)
          ]);

          const web = [];
          const topics = ddg && ddg.RelatedTopics ? ddg.RelatedTopics : [];
          topics.forEach((entry) => {
            if (entry && entry.Text) {
              web.push({
                title: String(entry.Text).split(' - ')[0] || q,
                url: entry.FirstURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`,
                snippet: entry.Text || 'Informations publiques associées.',
                domain: safeDomain(entry.FirstURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`),
                date: 'Aujourd’hui'
              });
            }
            if (entry && Array.isArray(entry.Topics)) {
              entry.Topics.forEach((t) => {
                if (t && t.Text) {
                  web.push({
                    title: String(t.Text).split(' - ')[0] || q,
                    url: t.FirstURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`,
                    snippet: t.Text || 'Informations publiques.',
                    domain: safeDomain(t.FirstURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`),
                    date: 'Aujourd’hui'
                  });
                }
              });
            }
          });

          if (!web.length && ddg && ddg.AbstractText) {
            web.push({
              title: ddg.Heading || q,
              url: ddg.AbstractURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`,
              snippet: ddg.AbstractText || 'Résumé public',
              domain: safeDomain(ddg.AbstractURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`),
              date: 'Aujourd’hui'
            });
          }

          const page = wiki && wiki.query && wiki.query.pages ? Object.values(wiki.query.pages)[0] : null;
          const wikiSummary = page && page.extract ? String(page.extract).slice(0, 420) : '';
          const wikiTitle = page && page.title ? page.title : `Résumé ${q}`;

          const newsItems = (news && news.items ? news.items : []).slice(0, 6).map((item) => ({
            title: item.title || q,
            link: item.link || '#',
            source: item.source || 'Google News',
            published: item.pubDate || 'récemment',
            description: item.description || 'Actualité récente.',
            thumbnail: item.thumbnail || item.enclosure?.link
          }));

          const images = (imgs && imgs.results ? imgs.results : []).slice(0, 8).map((img) => ({
            title: img.title || q,
            source: img.source || 'Public',
            thumbnail: img.thumbnail || img.image || 'https://images.unsplash.com/photo-1518770660439-463ac1d17e82?auto=format&fit=crop&w=900&q=80',
            link: img.url || `https://www.bing.com/images/search?q=${encodeURIComponent(q)}`
          }));

          const sources = web.slice(0, 4).map(r => ({ ...r })); 
          const aiText = `**Aperçu IA**\n\nLe sujet “${q}” apparaît dans les sources publiques et les références d’actualité.\n\n- Contexte général\n- Éléments récents\n- Points de repère utiles\n\nLes informations disponibles convergent vers une compréhension cohérente. [1]\n\nLes sources publiques et les résumés encyclopédiques se complètent efficacement et permettent d’avoir une vue d’ensemble fiable sur ${q}. [2] [3]`;

          return {
            query: q,
            type: 'web',
            webResults: web.slice(0, 6),
            aiOverview: aiText,
            wikiSummary,
            wikiTitle,
            newsItems: newsItems.length ? newsItems : makeFallbackData(q).newsItems,
            images: images.length ? images : makeFallbackData(q).images,
            sources
          };
        } catch (err) {
          return makeFallbackData(q);
        }
      }

      function renderHome() {
        const weather = state.weather || { temperature: 19, condition: 'Nuageux', humidity: 60, wind: 12, location: 'Paris' };
        const tiles = [
          { title: 'Météo', text: `${Math.round(weather.temperature)}°C`, meta: `${weather.condition} • ${weather.location}`, size: 'medium', accent: 'cyan' },
          { title: 'Actualités', text: 'Live', meta: 'En direct', size: 'small', accent: 'amber' },
          { title: 'Fond d’écran', text: 'Bing', meta: 'du jour', size: 'small', accent: 'purple' },
          { title: 'Historique', text: 'Récents', meta: 'recherches', size: 'wide', accent: 'green' },
          { title: 'Explorer', text: 'Sujets', meta: 'à la carte', size: 'small', accent: 'pink' },
          { title: 'Horloge', text: formatTime(), meta: 'locale', size: 'small', accent: 'cyan' },
          { title: 'IA overview', text: 'Synthèse', meta: 'assistée', size: 'large', accent: 'purple' }
        ];

        return `
          <div class="home-screen">
            <section class="hero metro-panel">
              <div>
                <span class="eyebrow">Aujourd’hui</span>
                <h1>Découvrez ce qui compte, visuellement.</h1>
                <p>Recherche en français, résultats enrichis, actualités et aperçu IA dans une interface Metro inspirée de Windows 8.</p>
              </div>
              <div class="hero-side">
                <div class="mini-stat">
                  <span>Heure locale</span>
                  <strong>${formatTime()}</strong>
                </div>
                <div class="weather-pill">
                  <span>Météo</span>
                  <strong>${Math.round(weather.temperature)}°C</strong>
                </div>
              </div>
            </section>

            <section class="tile-grid">
              ${tiles.map(tile => `
                <button class="tile ${tile.size} accent-${tile.accent}" type="button" data-action="${tile.title}">
                  <span class="tile-tag">${tile.title}</span>
                  <strong>${tile.text}</strong>
                  <small>${tile.meta}</small>
                </button>
              `).join('')}
            </section>
          </div>
        `;
      }

      function renderSearchBar({ value = '', suggestions = [], currentType = 'web' }) {
        const tabs = [
          { id: 'web', label: 'Web' },
          { id: 'images', label: 'Images' },
          { id: 'news', label: 'Actualités' }
        ];

        return `
          <div class="search-wrap">
            <div class="search-shell">
              <div class="search-glass">⌕</div>
              <input id="search-input" type="text" value="${escapeHtml(value)}" placeholder="Rechercher..." />
              <button class="search-btn" type="button">Rechercher</button>
            </div>

            <div class="search-tabs">
              ${tabs.map(tab => `
                <button class="tab ${currentType === tab.id ? 'active' : ''}" type="button" data-type="${tab.id}">
                  ${tab.label}
                </button>
              `).join('')}
            </div>

            ${suggestions.length ? `
              <div class="suggestions">
                ${suggestions.map(s => `<button type="button" class="suggestion-item" data-suggest="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderResultsPage() {
        const data = state.data || makeFallbackData(state.search || 'recherche');
        const type = state.type || 'web';

        if (state.loading) {
          return `
            <div class="loader-box">
              <div class="loader"></div>
            </div>
          `;
        }

        return `
          <section class="results-page">
            <div class="results-header">
              <div>
                <span class="eyebrow">Résultats</span>
                <h2>${escapeHtml(data.query || state.search || 'Recherche')}</h2>
              </div>

              <div class="search-tabs">
                ${['web','images','news'].map(tab => `
                  <button class="tab ${type === tab ? 'active' : ''}" type="button" data-type="${tab}">
                    ${tab === 'web' ? 'Web' : tab === 'images' ? 'Images' : 'Actualités'}
                  </button>
                `).join('')}
              </div>
            </div>

            ${type === 'images' ? `
              <div class="image-grid">
                ${data.images.map((img, i) => `
                  <a class="image-card" href="${img.link}" target="_blank" rel="noreferrer">
                    <img src="${img.thumbnail}" alt="${escapeHtml(img.title)}" />
                    <div class="image-overlay">
                      <strong>${escapeHtml(img.title)}</strong>
                      <small>${escapeHtml(img.source)}</small>
                    </div>
                  </a>
                `).join('')}
              </div>
            ` : ''}

            ${type === 'news' ? `
              <div class="news-grid">
                ${data.newsItems.map(item => `
                  <article class="news-card">
                    <img src="${item.thumbnail || 'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80'}" alt="${escapeHtml(item.title)}" />
                    <div class="news-content">
                      <span>${escapeHtml(item.source || 'News')}</span>
                      <h4>${escapeHtml(item.title)}</h4>
                      <small>${escapeHtml(item.published || 'Récemment')}</small>
                      <p>${escapeHtml(item.description || '')}</p>
                    </div>
                  </article>
                `).join('')}
              </div>
            ` : ''}

            ${type === 'web' ? `
              <div class="results-layout">
                <div>
                  <div class="results-list">
                    ${data.webResults.map((result, idx) => `
                      <article class="result-card">
                        <div class="result-top">
                          <span>${escapeHtml(result.domain || 'nexsearch')}</span>
                          <span>${escapeHtml(result.date || 'Aujourd’hui')}</span>
                        </div>
                        <a href="${result.url}" target="_blank" rel="noreferrer"><h3>${escapeHtml(result.title)}</h3></a>
                        <p>${escapeHtml(result.snippet)}</p>
                      </article>
                    `).join('')}
                  </div>

                  ${state.aiEnabled ? `
                    <div class="ai-panel" style="margin-top:18px;">
                      <div class="eyebrow">Aperçu IA</div>
                      <div class="ai-body">
                        ${renderAiMarkdown(data.aiOverview || '')}
                      </div>
                    </div>
                  ` : ''}

                  ${data.wikiSummary ? `
                    <div class="wiki-panel" style="margin-top:18px;">
                      <div class="eyebrow">Wikipedia</div>
                      <h3>${escapeHtml(data.wikiTitle || 'Résumé')}</h3>
                      <p style="color: var(--muted); line-height: 1.7;">${escapeHtml(data.wikiSummary)}</p>
                    </div>
                  ` : ''}
                </div>

                <aside class="sidebar-panel">
                  <div class="quick-panel">
                    <div class="eyebrow">Sources</div>
                    <ul>
                      ${(data.sources && data.sources.length ? data.sources : data.webResults).slice(0,6).map((src, idx) => `
                        <li><a href="${src.url}" target="_blank" rel="noreferrer">[${idx+1}] ${escapeHtml(src.title || src.domain || 'Source')}</a></li>
                      `).join('')}
                    </ul>
                  </div>
                </aside>
              </div>
            ` : ''}
          </section>
        `;
      }

      function renderAiMarkdown(text) {
        const lines = (text || '').split('\\n');
        let html = '';

        lines.forEach(line => {
          if (!line.trim()) return;
          if (line.startsWith('**')) {
            html += `<h4>${escapeHtml(line.replace(/\\*\\*/g, ''))}</h4>`;
          } else if (line.startsWith('- ')) {
            html += `<li>${escapeHtml(line.replace('- ', ''))}</li>`;
          } else {
            html += `<p>${escapeHtml(line)}</p>`;
          }
        });

        return html;
      }

      function renderSettings() {
        if (!state.settingsOpen) return '';
        const colors = ['#66d9ef', '#7c9cff', '#ff9f7c', '#7ee7a4', '#f7d154'];

        return `
          <div class="settings-backdrop">
            <aside class="settings-panel">
              <div class="settings-header">
                <div>
                  <span class="eyebrow">Paramètres</span>
                  <h3>Personnalisation</h3>
                </div>
                <button type="button" class="close-btn" aria-label="Fermer">✕</button>
              </div>

              <div class="settings-group">
                <label>Accent</label>
                <div class="swatches">
                  ${colors.map(c => `
                    <button class="swatch ${state.accent === c ? 'active' : ''}" type="button" data-accent="${c}" style="background:${c};"></button>
                  `).join('')}
                </div>
              </div>

              <div class="settings-group settings-inline">
                <label>Mode sombre</label>
                <button type="button" class="toggle-btn" data-theme-toggle>${state.theme === 'dark' ? 'Activé' : 'Désactivé'}</button>
              </div>

              <div class="settings-group settings-inline">
                <label>Aperçu IA</label>
                <button type="button" class="toggle-btn" data-ai-toggle>${state.aiEnabled ? 'Activé' : 'Désactivé'}</button>
              </div>

              <div class="settings-group">
                <div class="settings-inline">
                  <label>Historique</label>
                  <button type="button" class="link-btn" data-clear-history>Effacer</button>
                </div>
                <div class="history-list" style="margin-top:10px;">
                  ${state.history.length ? state.history.map(item => `
                    <button class="history-item" type="button" data-history-item="${escapeHtml(item)}">${escapeHtml(item)}</button>
                  `).join('') : `<div style="color: var(--muted); opacity: 0.9;">Aucun historique pour le moment.</div>`}
                </div>
              </div>
            </aside>
          </div>
        `;
      }

      function render() {
        document.documentElement.dataset.theme = state.theme;
        document.documentElement.style.setProperty('--accent', state.accent);

        const topbar = `
          <header class="topbar">
            <div class="brand" data-home>
              <div class="brand-mark">N</div>
              <div>
                <div class="brand-name">NexSearch</div>
                <small>Recherche visuelle</small>
              </div>
            </div>

            <div class="search-block">
              ${renderSearchBar({
                value: state.search,
                suggestions: state.search ? state.suggestions || [] : [],
                currentType: state.type
              })}
            </div>

            <div class="top-actions">
              <button class="ghost-btn" type="button" data-settings-toggle>Paramètres</button>
            </div>
          </header>
        `;

        const main = state.route === 'search' ? renderResultsPage() : renderHome();

        app.innerHTML = `
          ${topbar}
          ${main}
          ${renderSettings()}
        `;

        bindEvents();
      }

      async function updateSuggestionList() {
        const q = String(state.search || '').trim();
        if (!q) {
          state.suggestions = [];
          render();
          return;
        }
        const res = await fetchSuggestions(q);
        state.suggestions = res;
        render();
      }

      function bindEvents() {
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            state.search = e.target.value;
            if (state.search.trim()) {
              updateSuggestionList();
            } else {
              state.suggestions = [];
              render();
            }
          });

          searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              runSearch(state.search, state.type);
            }
          });

          searchInput.addEventListener('focus', async () => {
            if (state.search.trim()) {
              const suggestions = await fetchSuggestions(state.search);
              state.suggestions = suggestions;
              render();
            }
          });
        }

        document.querySelectorAll('.search-btn').forEach(btn => {
          btn.addEventListener('click', () => runSearch(state.search, state.type));
        });

        document.querySelectorAll('.tab').forEach(btn => {
          btn.addEventListener('click', () => {
            const type = btn.dataset.type;
            if (type) {
              if (state.route === 'search') {
                state.type = type;
                runSearch(state.search, type);
              } else {
                state.type = type;
                render();
              }
            }
          });
        });

        document.querySelectorAll('.suggestion-item').forEach(btn => {
          btn.addEventListener('click', () => {
            const val = btn.dataset.suggest;
            state.search = val || '';
            state.suggestions = [];
            runSearch(state.search, state.type);
          });
        });

        document.querySelectorAll('[data-settings-toggle]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.settingsOpen = !state.settingsOpen;
            render();
          });
        });

        document.querySelectorAll('.close-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            state.settingsOpen = false;
            render();
          });
        });

        document.querySelectorAll('[data-accent]').forEach(btn => {
          btn.addEventListener('click', () => {
            setAccent(btn.dataset.accent);
            state.settingsOpen = false;
            render();
          });
        });

        document.querySelectorAll('[data-theme-toggle]').forEach(btn => {
          btn.addEventListener('click', () => {
            setTheme(state.theme === 'dark' ? 'light' : 'dark');
            render();
          });
        });

        document.querySelectorAll('[data-ai-toggle]').forEach(btn => {
          btn.addEventListener('click', () => {
            setAI(!state.aiEnabled);
            render();
          });
        });

        document.querySelectorAll('[data-clear-history]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.history = [];
            saveJSON(STORAGE_KEYS.history, []);
            render();
          });
        });

        document.querySelectorAll('[data-history-item]').forEach(btn => {
          btn.addEventListener('click', () => {
            const val = btn.dataset.historyItem;
            state.search = val || '';
            runSearch(state.search, 'web');
          });
        });

        document.querySelectorAll('[data-home]').forEach(el => {
          el.addEventListener('click', () => {
            state.route = 'home';
            render();
          });
        });

        document.querySelectorAll('.tile').forEach(btn => {
          btn.addEventListener('click', () => {
            const action = btn.dataset.action;
            if (!action) return;

            if (action === 'Historique') {
              state.route = 'search';
              state.search = state.history[0] || 'recherche';
              state.type = 'web';
              runSearch(state.search, state.type);
              return;
            }

            if (action === 'Actualités') {
              state.route = 'search';
              state.search = 'actualités du jour';
              state.type = 'news';
              runSearch(state.search, 'news');
              return;
            }

            if (action === 'Météo') {
              state.route = 'search';
              state.search = 'météo locale';
              state.type = 'web';
              runSearch(state.search, 'web');
              return;
            }

            if (action === 'Explorer') {
              state.route = 'search';
              state.search = 'explorer';
              state.type = 'web';
              runSearch(state.search, 'web');
              return;
            }

            if (action === 'IA overview') {
              state.route = 'search';
              state.search = 'intelligence artificielle';
              state.type = 'web';
              runSearch(state.search, 'web');
              return;
            }

            state.search = action;
            state.route = 'search';
            runSearch(action, 'web');
          });
        });
      }

      async function runSearch(query, type = 'web') {
        const q = String(query || '').trim();
        if (!q) return;
        state.search = q;
        state.type = type;
        state.route = 'search';
        state.loading = true;
        render();

        const result = await searchData(q);
        result.type = type;
        state.data = result;
        pushHistory(q);
        state.loading = false;
        render();
      }

      (async function init() {
        setAccent(state.accent);
        setTheme(state.theme);
        state.weather = await geoWeather();
        render();
      })();
    </script>
  </body>
</html>
