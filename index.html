<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="description" content="NexSearch — moteur de recherche visuel inspiré du design Metro." />
    <title>NexSearch</title>
    <style>
      :root {
        --bg: #0b0f17;
        --bg-2: #121827;
        --panel: rgba(20, 27, 39, 0.82);
        --panel-strong: rgba(17, 24, 39, 0.96);
        --line: rgba(255, 255, 255, 0.08);
        --text: #edf5ff;
        --muted: #a9b8cd;
        --metro-accent: #1ba1e2;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        --radius: 22px;
      }

      :root[data-theme='light'] {
        --bg: #edf3fb;
        --bg-2: #dfeaff;
        --panel: rgba(255, 255, 255, 0.85);
        --panel-strong: rgba(255, 255, 255, 0.96);
        --line: rgba(21, 33, 61, 0.08);
        --text: #14213d;
        --muted: #4d5e7c;
        --shadow: 0 14px 36px rgba(70, 90, 129, 0.14);
      }

      * { box-sizing: border-box; }

      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(27,161,226,0.15), transparent 30%),
          linear-gradient(180deg, var(--bg), var(--bg-2));
      }

      a { color: inherit; text-decoration: none; }
      button, input { font: inherit; }
      button { cursor: pointer; }

      .app-shell {
        max-width: 1480px;
        margin: 0 auto;
        padding: 18px 18px 40px;
        position: relative;
      }

      .metro-backdrop {
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(
            ellipse at 15% 0%,
            color-mix(in srgb, var(--metro-accent) 28%, transparent),
            transparent 55%
          ),
          linear-gradient(180deg, #16171a 0%, #0c0d0f 100%);
      }

      .topbar {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr) 160px;
        gap: 16px;
        align-items: center;
        margin-bottom: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        user-select: none;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-weight: 900;
        color: #061118;
        background: linear-gradient(135deg, var(--metro-accent), color-mix(in srgb, var(--metro-accent) 55%, white));
        box-shadow: var(--shadow);
      }

      .brand-name {
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .brand small {
        color: var(--muted);
        display: block;
        font-size: 0.72rem;
      }

      .search-col { position: relative; }

      .search-shell {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 10px 12px 10px 14px;
      }

      .search-icon { opacity: 0.9; font-size: 1.2rem; }

      .search-shell input {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--text);
        outline: none;
        font-size: 1rem;
      }

      .search-shell input::placeholder { color: var(--muted); }

      .search-shell button {
        border: none;
        border-radius: 14px;
        padding: 10px 14px;
        background: linear-gradient(135deg, color-mix(in srgb, var(--metro-accent) 80%, white), color-mix(in srgb, var(--metro-accent) 55%, #fff));
        color: #07151d;
        font-weight: 800;
      }

      .search-tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .tab {
        border: 1px solid transparent;
        border-radius: 10px;
        background: rgba(255,255,255,0.04);
        color: var(--text);
        opacity: 0.85;
        padding: 8px 12px;
      }

      .tab.active {
        background: color-mix(in srgb, var(--metro-accent) 26%, transparent);
        border-color: color-mix(in srgb, var(--metro-accent) 60%, transparent);
      }

      .suggestions {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 10px);
        background: var(--panel-strong);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
        z-index: 20;
      }

      .suggestions button {
        display: block;
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        color: var(--text);
        padding: 10px 12px;
      }

      .suggestions button:hover {
        background: rgba(255,255,255,0.05);
      }

      .top-actions {
        display: flex;
        justify-content: flex-end;
      }

      .settings-button {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255,255,255,0.04);
        color: var(--text);
        padding: 10px 14px;
      }

      .hero, .metro-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .home-page, .search-page {
        display: grid;
        gap: 18px;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.6fr 0.8fr;
        gap: 18px;
        padding: 26px 20px;
      }

      .eyebrow {
        display: inline-block;
        color: var(--metro-accent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.7rem;
        font-weight: 800;
      }

      .hero h1 {
        margin: 12px 0 10px;
        font-size: clamp(2rem, 4vw, 4rem);
        line-height: 1.05;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
        max-width: 720px;
        line-height: 1.6;
      }

      .hero-side {
        display: flex;
        flex-direction: column;
        gap: 12px;
        justify-content: center;
      }

      .mini-stat {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255,255,255,0.03);
        padding: 16px 18px;
      }

      .mini-stat span {
        color: var(--muted);
        font-size: 0.72rem;
      }

      .mini-stat strong {
        display: block;
        margin-top: 6px;
        font-size: 1.5rem;
      }

      .tile-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(100px, 1fr));
        gap: 18px;
      }

      .tile {
        position: relative;
        min-height: 150px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: space-between;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        box-shadow: var(--shadow);
        color: white;
        padding: 18px;
        text-align: left;
        overflow: hidden;
        transition: transform 0.18s ease;
        animation: tile-in 0.7s ease backwards;
      }

      .tile:hover { transform: translateY(-3px); }

      .tile.small { grid-column: span 2; }
      .tile.medium { grid-column: span 2; }
      .tile.wide { grid-column: span 3; }
      .tile.large { grid-column: span 4; }

      .accent-cyan { background: linear-gradient(135deg, rgba(27,161,226,0.95), rgba(91,141,239,0.8)); }
      .accent-purple { background: linear-gradient(135deg, rgba(168,85,247,0.9), rgba(96,165,250,0.7)); }
      .accent-amber { background: linear-gradient(135deg, rgba(242,155,39,0.95), rgba(210,120,0,0.72)); }
      .accent-green { background: linear-gradient(135deg, rgba(61,189,138,0.9), rgba(53,164,145,0.74)); }
      .accent-pink { background: linear-gradient(135deg, rgba(217,94,216,0.9), rgba(224,109,91,0.7)); }

      .tile-tag {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.9;
      }

      .tile strong {
        font-size: clamp(1.5rem, 2vw, 2.2rem);
      }

      .tile small { opacity: 0.85; }

      .search-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .search-header h2 {
        margin: 10px 0 0;
        font-size: clamp(1.8rem, 2vw, 3rem);
      }

      .results-layout {
        display: grid;
        grid-template-columns: minmax(0, 2.2fr) minmax(260px, 1fr);
        gap: 18px;
      }

      .results-main {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .results-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .result-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 18px 20px;
      }

      .result-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 8px;
      }

      .result-card h3 {
        margin: 0 0 10px;
        font-size: 1.45rem;
      }

      .result-card p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
      }

      .ai-panel, .quick-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 20px;
      }

      .ai-body h4 {
        margin: 12px 0 8px;
        font-size: 1.05rem;
      }

      .ai-body p, .ai-body li {
        color: var(--muted);
        line-height: 1.7;
      }

      .quick-panel ul {
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }

      .quick-panel li a {
        display: block;
        color: var(--text);
        opacity: 0.85;
      }

      .image-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(160px, 1fr));
        gap: 14px;
      }

      .image-card {
        position: relative;
        overflow: hidden;
        min-height: 220px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
      }

      .image-card img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .image-overlay {
        position: absolute;
        inset: auto 0 0 0;
        padding: 16px;
        background: linear-gradient(180deg, transparent, rgba(0,0,0,0.72));
      }

      .image-overlay strong {
        display: block;
        font-size: 0.98rem;
      }

      .image-overlay small {
        color: rgba(255,255,255,0.8);
      }

      .news-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(220px, 1fr));
        gap: 16px;
      }

      .news-card {
        overflow: hidden;
      }

      .news-card img {
        display: block;
        width: 100%;
        height: 180px;
        object-fit: cover;
      }

      .news-content {
        padding: 18px;
      }

      .news-content span {
        color: var(--metro-accent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.72rem;
        font-weight: 800;
      }

      .news-content h3 {
        margin: 10px 0 8px;
        font-size: 1.2rem;
      }

      .news-content small { color: var(--muted); }

      .news-content p {
        margin: 12px 0 0;
        line-height: 1.55;
        color: var(--muted);
      }

      .settings-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.38);
        z-index: 50;
        display: flex;
        justify-content: flex-end;
      }

      .settings-panel {
        width: min(420px, 92vw);
        height: 100%;
        background: var(--panel-strong);
        border-left: 1px solid var(--line);
        padding: 18px 18px 28px;
      }

      .settings-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .settings-header h3 {
        margin: 8px 0 0;
        font-size: 1.8rem;
      }

      .close-btn {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        color: var(--text);
      }

      .settings-group {
        margin-bottom: 18px;
      }

      .settings-group label,
      .settings-block label {
        display: block;
        margin-bottom: 10px;
        color: var(--muted);
      }

      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .swatch {
        width: 32px;
        height: 32px;
        border: 2px solid transparent;
        border-radius: 50%;
      }

      .swatch.active {
        border-color: white;
        box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
      }

      .settings-block {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .toggle, .link-btn {
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 12px;
      }

      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .history-list {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }

      .history-item {
        display: block;
        width: 100%;
        text-align: left;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
        border-radius: 12px;
        color: var(--text);
        padding: 10px 12px;
      }

      .history-list p { color: var(--muted); }

      @keyframes tile-in {
        from {
          opacity: 0;
          transform: perspective(700px) translateX(50px) rotateY(-26deg);
        }
        to {
          opacity: 1;
          transform: perspective(700px) translateX(0) rotateY(0);
        }
      }

      @media (max-width: 980px) {
        .topbar { grid-template-columns: 1fr; }
        .hero { grid-template-columns: 1fr; }
        .results-layout { grid-template-columns: 1fr; }
        .image-grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
        .news-grid { grid-template-columns: 1fr; }
      }

      @media (max-width: 640px) {
        .app-shell { padding: 12px; }
        .tile-grid { grid-template-columns: repeat(4, minmax(90px, 1fr)); }
        .tile.small, .tile.medium, .tile.wide, .tile.large { grid-column: span 2; }
        .image-grid { grid-template-columns: 1fr; }
        .search-shell { flex-wrap: wrap; }
        .search-shell button { width: 100%; }
        .search-header { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      const DEFAULT_ACCENTS = ['#1ba1e2', '#5b8def', '#f29b27', '#3dbd8a', '#d95ed8', '#e06d5b'];

      const STORAGE = {
        settings: 'nexsearch-settings-v1',
        history: 'nexsearch-history-v1'
      };

      const state = {
        route: 'home',
        type: 'web',
        query: '',
        suggestions: [],
        settingsOpen: false,
        weather: null,
        results: null,
        loading: false
      };

      function readJSON(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      }

      function writeJSON(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      function loadSettings() {
        const defaults = {
          accent: '#1ba1e2',
          theme: 'dark',
          aiEnabled: true,
          history: []
        };
        return { ...defaults, ...readJSON(STORAGE.settings, defaults) };
      }

      function saveSettings() {
        writeJSON(STORAGE.settings, state.settings);
      }

      function ensureSettings() {
        if (!state.settings) state.settings = loadSettings();
      }

      function updateAccent(color) {
        state.settings.accent = color;
        document.documentElement.style.setProperty('--metro-accent', color);
        saveSettings();
      }

      function updateTheme(theme) {
        state.settings.theme = theme;
        document.documentElement.dataset.theme = theme;
        saveSettings();
      }

      function addHistory(value) {
        const clean = String(value || '').trim();
        if (!clean) return;
        const next = [clean, ...state.settings.history.filter(item => item !== clean)].slice(0, 8);
        state.settings.history = next;
        saveSettings();
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function timeLabel() {
        return new Date().toLocaleTimeString('fr-FR', {
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      function safeDomain(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, '');
        } catch {
          return 'nexsearch';
        }
      }

      async function fetchJson(url) {
        try {
          const r = await fetch(url, { headers: { Accept: 'application/json' } });
          if (!r.ok) return null;
          const txt = await r.text();
          return txt ? JSON.parse(txt) : null;
        } catch {
          return null;
        }
      }

      async function fetchSuggestions(query) {
        const q = String(query || '').trim();
        if (!q) return [];
        try {
          const data = await fetchJson(`https://duckduckgo.com/ac/?q=${encodeURIComponent(q)}&type=list`);
          if (Array.isArray(data)) {
            const items = data
              .map(item => typeof item === 'string' ? item : item?.phrase)
              .filter(Boolean)
              .slice(0, 6);
            if (items.length) return items;
          }
        } catch {}
        return [`${q} france`, `${q} actualités`, `${q} images`, `${q} météo`, `${q} wikipedia`];
      }

      async function getWeather() {
        if (!navigator.geolocation) return { temp: 19, label: 'Nuageux', city: 'Paris' };
        return new Promise(resolve => {
          navigator.geolocation.getCurrentPosition(async ({ latitude, longitude }) => {
            try {
              const data = await fetchJson(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`);
              if (data && data.current) {
                const code = Number(data.current.weather_code || 1);
                const map = {
                  0: 'Dégagé', 1: 'Principalement clair', 2: 'Partiellement nuageux', 3: 'Couvert',
                  45: 'Brouillard', 48: 'Brouillard givrant', 51: 'Bruine légère', 61: 'Pluie modérée',
                  80: 'Averses', 95: 'Orage'
                };
                resolve({
                  temp: Number(data.current.temperature_2m || 19),
                  label: map[code] || 'Nuageux',
                  city: 'Votre emplacement'
                });
                return;
              }
            } catch {}
            resolve({ temp: 19, label: 'Nuageux', city: 'Paris' });
          }, () => resolve({ temp: 19, label: 'Nuageux', city: 'Paris' }), { enableHighAccuracy: true, timeout: 10000 });
        });
      }

      function makeFallbackData(query) {
        return {
          query,
          type: 'web',
          webResults: [
            {
              title: `${query} — aperçu et références`,
              url: `https://www.google.com/search?q=${encodeURIComponent(query)}`,
              snippet: `Documents publics et sources fiables sur ${query}.`,
              domain: 'google.com',
              displayUrl: 'google.com'
            },
            {
              title: `Actualités sur ${query}`,
              url: `https://news.google.com/search?q=${encodeURIComponent(query)}`,
              snippet: `Les derniers articles et tendances liées à ${query}.`,
              domain: 'news.google.com',
              displayUrl: 'news.google.com'
            },
            {
              title: `Wikipedia : ${query}`,
              url: `https://fr.wikipedia.org/wiki/${encodeURIComponent(query)}`,
              snippet: `Résumé encyclopédique, contexte et éléments historiques.`,
              domain: 'wikipedia.org',
              displayUrl: 'fr.wikipedia.org'
            }
          ],
          aiOverview: `**Aperçu IA**\n\nLe sujet “${query}” est abordé dans plusieurs sources publiques et dans des références d’actualité.\n\n- Contexte général\n- Éléments récents\n- Références utiles\n\nLes informations disponibles convergent vers une compréhension cohérente [1].\n\nLes sources publiques et les résumés encyclopédiques se complètent et permettent d’avoir une vue d’ensemble fiable sur ${query}. [2] [3]`,
          wikiSummary: `Le sujet “${query}” est généralement documenté dans les sources publiques et est utile pour comprendre le contexte et les évolutions récentes.`,
          wikiTitle: `Résumé ${query}`,
          newsItems: [
            {
              title: `À l’instant : ${query}`,
              source: 'Google News',
              published: 'Il y a 30 min',
              description: 'Des informations récentes et pertinentes autour du sujet.',
              link: `https://news.google.com/search?q=${encodeURIComponent(query)}`,
              thumbnail: 'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1200&q=80'
            }
          ],
          images: Array.from({ length: 8 }, (_, i) => ({
            title: `${query} ${i + 1}`,
            source: 'Public',
            thumbnail: 'https://images.unsplash.com/photo-1518770660439-463ac1d17e82?auto=format&fit=crop&w=900&q=80',
            full: 'https://images.unsplash.com/photo-1518770660439-463ac1d17e82?auto=format&fit=crop&w=1600&q=80',
            link: `https://www.bing.com/images/search?q=${encodeURIComponent(query)}`,
            domain: 'bing.com'
          })),
          sources: []
        };
      }

      async function fetchSearchData(query, type = 'web') {
        const q = String(query || '').trim();
        if (!q) return makeFallbackData('recherche');

        try {
          const [ddg, wiki, news, imgs] = await Promise.all([
            fetchJson(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1&kl=fr-fr`),
            fetchJson(`https://fr.wikipedia.org/w/api.php?action=query&format=json&prop=extracts&exintro=1&explaintext=1&redirects=1&titles=${encodeURIComponent(q)}&origin=*`),
            fetchJson(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://news.google.com/rss/search?q=' + q + '&hl=fr&gl=FR&ceid=FR:fr')}`),
            fetchJson(`https://duckduckgo.com/i.js?q=${encodeURIComponent(q)}&l=fr-fr&o=json`)
          ]);

          const web = [];
          const topics = ddg && ddg.RelatedTopics ? ddg.RelatedTopics : [];

          topics.forEach((entry) => {
            if (entry && entry.Text) {
              web.push({
                title: String(entry.Text).split(' - ')[0] || q,
                url: entry.FirstURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`,
                snippet: entry.Text || 'Informations associées.',
                domain: safeDomain(entry.FirstURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`),
                displayUrl: safeDomain(entry.FirstURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`)
              });
            }
            if (entry && Array.isArray(entry.Topics)) {
              entry.Topics.forEach((t) => {
                if (t && t.Text) {
                  web.push({
                    title: String(t.Text).split(' - ')[0] || q,
                    url: t.FirstURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`,
                    snippet: t.Text || 'Informations associées.',
                    domain: safeDomain(t.FirstURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`),
                    displayUrl: safeDomain(t.FirstURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`)
                  });
                }
              });
            }
          });

          if (!web.length && ddg && ddg.AbstractText) {
            web.push({
              title: ddg.Heading || q,
              url: ddg.AbstractURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`,
              snippet: ddg.AbstractText || 'Résumé public',
              domain: safeDomain(ddg.AbstractURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`),
              displayUrl: safeDomain(ddg.AbstractURL || `https://www.google.com/search?q=${encodeURIComponent(q)}`)
            });
          }

          const page = wiki && wiki.query && wiki.query.pages ? Object.values(wiki.query.pages)[0] : null;
          const wikiSummary = page && page.extract ? String(page.extract).slice(0, 420) : '';
          const wikiTitle = page && page.title ? page.title : `Résumé ${q}`;

          const newsItems = (news && news.items ? news.items : []).slice(0, 6).map(item => ({
            title: item.title || q,
            source: item.source || 'Google News',
            published: item.pubDate || 'récemment',
            description: item.description || 'Actualité récente.',
            link: item.link || '#',
            thumbnail: item.thumbnail || item.enclosure?.link
          }));

          const images = (imgs && imgs.results ? imgs.results : []).slice(0, 8).map(img => ({
            title: img.title || q,
            source: img.source || 'Public',
            thumbnail: img.thumbnail || img.image || 'https://images.unsplash.com/photo-1518770660439-463ac1d17e82?auto=format&fit=crop&w=900&q=80',
            full: img.thumbnail || img.image || 'https://images.unsplash.com/photo-1518770660439-463ac1d17e82?auto=format&fit=crop&w=1600&q=80',
            link: img.url || `https://www.bing.com/images/search?q=${encodeURIComponent(q)}`,
            domain: 'public'
          }));

          return {
            query: q,
            type,
            webResults: web.slice(0, 6),
            aiOverview: `**Aperçu IA**\n\nLe sujet “${q}” apparaît dans plusieurs sources publiques et d’actualité.\n\n- Contexte général\n- Éléments récents\n- Références utiles\n\nLes informations disponibles convergent vers une compréhension cohérente [1].\n\nLes sources publiques et les résumés encyclopédiques se complètent efficacement pour offrir une vue d’ensemble fiable sur ${q}. [2] [3]`,
            wikiSummary,
            wikiTitle,
            newsItems: newsItems.length ? newsItems : makeFallbackData(q).newsItems,
            images: images.length ? images : makeFallbackData(q).images,
            sources: web.slice(0, 4)
          };
        } catch {
          return makeFallbackData(q);
        }
      }

      function renderAiMarkdown(md) {
        const lines = String(md || '').split('\n');
        let html = '';
        for (const line of lines) {
          if (!line.trim()) continue;
          if (line.startsWith('**')) {
            html += `<h4>${escapeHtml(line.replace(/\*\*/g, ''))}</h4>`;
          } else if (line.startsWith('- ')) {
            html += `<li>${escapeHtml(line.replace('- ', ''))}</li>`;
          } else {
            html += `<p>${escapeHtml(line)}</p>`;
          }
        }
        return html;
      }

      function renderHome() {
        const weather = state.weather || { temp: 19, label: 'Nuageux', city: 'Paris' };
        const tiles = [
          { label: 'Météo', text: `${Math.round(weather.temp)}°C`, meta: `${weather.label} • ${weather.city}`, size: 'medium', accent: 'cyan' },
          { label: 'Actualités', text: 'Live', meta: 'en direct', size: 'small', accent: 'amber' },
          { label: 'Fond d’écran', text: 'Bing', meta: 'du jour', size: 'small', accent: 'purple' },
          { label: 'Historique', text: 'Récents', meta: 'recherches', size: 'wide', accent: 'green' },
          { label: 'Explorer', text: 'Sujets', meta: 'à la carte', size: 'small', accent: 'pink' },
          { label: 'Horloge', text: timeLabel(), meta: 'locale', size: 'small', accent: 'cyan' },
          { label: 'IA overview', text: 'Synthèse', meta: 'assistée', size: 'large', accent: 'purple' }
        ];

        return `
          <main class="home-page">
            <section class="hero metro-panel">
              <div>
                <span class="eyebrow">Aujourd’hui</span>
                <h1>Découvrez ce qui compte, visuellement.</h1>
                <p>Recherche en français, résultats enrichis, actualités et aperçu IA dans une interface Metro inspirée de Windows 8.</p>
              </div>
              <div class="hero-side">
                <div class="mini-stat">
                  <span>Heure locale</span>
                  <strong>${timeLabel()}</strong>
                </div>
                <div class="mini-stat">
                  <span>Météo</span>
                  <strong>${Math.round(weather.temp)}°C</strong>
                </div>
              </div>
            </section>

            <section class="tile-grid">
              ${tiles.map((tile, idx) => `
                <button type="button" class="tile ${tile.size} accent-${tile.accent}" data-tile="${escapeHtml(tile.label)}" style="animation-delay:${idx * 90}ms">
                  <span class="tile-tag">${escapeHtml(tile.label)}</span>
                  <strong>${escapeHtml(tile.text)}</strong>
                  <small>${escapeHtml(tile.meta)}</small>
                </button>
              `).join('')}
            </section>
          </main>
        `;
      }

      function renderResultsPage() {
        const data = state.results || makeFallbackData(state.query || 'recherche');
        const type = state.type || 'web';

        if (state.loading) {
          return `
            <main class="search-page">
              <div style="min-height:220px;display:grid;place-items:center;">
                <div style="width:52px;height:52px;border-radius:50%;border:4px solid rgba(255,255,255,0.12);border-top-color:var(--metro-accent);animation:spin .8s linear infinite;"></div>
              </div>
            </main>
          `;
        }

        return `
          <main class="search-page">
            <div class="search-header">
              <div>
                <span class="eyebrow">Résultats</span>
                <h2>${escapeHtml(data.query || state.query || 'Recherche')}</h2>
              </div>

              <div class="search-tabs">
                ${['web','images','news'].map(tab => `
                  <button type="button" class="tab ${type === tab ? 'active' : ''}" data-tab="${tab}">
                    ${tab === 'web' ? 'Web' : tab === 'images' ? 'Images' : 'Actualités'}
                  </button>
                `).join('')}
              </div>
            </div>

            ${type === 'images' ? `
              <div class="image-grid">
                ${(data.images || []).map((img, i) => `
                  <a href="${img.link}" target="_blank" rel="noreferrer" class="image-card" key="${i}">
                    <img src="${img.thumbnail}" alt="${escapeHtml(img.title)}" />
                    <div class="image-overlay">
                      <strong>${escapeHtml(img.title)}</strong>
                      <small>${escapeHtml(img.source)}</small>
                    </div>
                  </a>
                `).join('')}
              </div>
            ` : ''}

            ${type === 'news' ? `
              <div class="news-grid">
                ${(data.newsItems || []).map((item, i) => `
                  <article class="news-card metro-panel">
                    <img src="${item.thumbnail || 'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1200&q=80'}" alt="${escapeHtml(item.title)}" />
                    <div class="news-content">
                      <span>${escapeHtml(item.source || 'News')}</span>
                      <h3>${escapeHtml(item.title)}</h3>
                      <small>${escapeHtml(item.published || 'Récemment')}</small>
                      <p>${escapeHtml(item.description || '')}</p>
                    </div>
                  </article>
                `).join('')}
              </div>
            ` : ''}

            ${type === 'web' ? `
              <div class="results-layout">
                <div class="results-main">
                  <div class="results-list">
                    ${(data.webResults || []).map((r, idx) => `
                      <article class="result-card">
                        <div class="result-top">
                          <span>${escapeHtml(r.domain || 'nexsearch')}</span>
                          <span>${escapeHtml(r.displayUrl || 'aujourd’hui')}</span>
                        </div>
                        <a href="${r.url}" target="_blank" rel="noreferrer"><h3>${escapeHtml(r.title)}</h3></a>
                        <p>${escapeHtml(r.snippet)}</p>
                      </article>
                    `).join('')}
                  </div>

                  ${state.settings.aiEnabled ? `
                    <div class="ai-panel">
                      <div class="eyebrow">Aperçu IA</div>
                      <div class="ai-body">
                        ${renderAiMarkdown(data.aiOverview || '')}
                      </div>
                    </div>
                  ` : ''}

                  ${data.wikiSummary ? `
                    <div class="ai-panel" style="margin-top:18px;">
                      <div class="eyebrow">Wikipedia</div>
                      <h3 style="margin:14px 0 8px;">${escapeHtml(data.wikiTitle || 'Résumé')}</h3>
                      <p style="margin:0;color:var(--muted);line-height:1.7;">${escapeHtml(data.wikiSummary)}</p>
                    </div>
                  ` : ''}
                </div>

                <aside class="sidebar">
                  <div class="quick-panel">
                    <div class="eyebrow">Sources</div>
                    <ul>
                      ${(data.sources && data.sources.length ? data.sources : data.webResults || []).slice(0, 6).map((src, idx) => `
                        <li><a href="${src.url}" target="_blank" rel="noreferrer">[${idx + 1}] ${escapeHtml(src.title || src.domain || 'Source')}</a></li>
                      `).join('')}
                    </ul>
                  </div>
                </aside>
              </div>
            ` : ''}
          </main>
        `;
      }

      function renderSettingsPanel() {
        if (!state.settingsOpen) return '';
        return `
          <div class="settings-backdrop" id="settings-backdrop">
            <aside class="settings-panel">
              <div class="settings-header">
                <div>
                  <span class="eyebrow">Paramètres</span>
                  <h3>Personnalisation</h3>
                </div>
                <button type="button" class="close-btn" id="close-settings">✕</button>
              </div>

              <div class="settings-group">
                <label>Accent</label>
                <div class="swatches">
                  ${DEFAULT_ACCENTS.map(color => `
                    <button type="button" class="swatch ${state.settings.accent === color ? 'active' : ''}" style="background:${color};" data-accent="${color}"></button>
                  `).join('')}
                </div>
              </div>

              <div class="settings-block">
                <label>Mode sombre</label>
                <button type="button" class="toggle" id="toggle-theme">
                  ${state.settings.theme === 'dark' ? 'Activé' : 'Désactivé'}
                </button>
              </div>

              <div class="settings-block">
                <label>Aperçu IA</label>
                <button type="button" class="toggle" id="toggle-ai">
                  ${state.settings.aiEnabled ? 'Activé' : 'Désactivé'}
                </button>
              </div>

              <div class="settings-group">
                <div class="settings-row">
                  <label>Historique</label>
                  <button type="button" class="link-btn" id="clear-history">Effacer</button>
                </div>
                <div class="history-list">
                  ${state.settings.history.length ? state.settings.history.map(item => `
                    <button type="button" class="history-item" data-history="${escapeHtml(item)}">${escapeHtml(item)}</button>
                  `).join('') : '<p>Aucun historique pour le moment.</p>'}
                </div>
              </div>
            </aside>
          </div>
        `;
      }

      function render() {
        if (!state.settings) state.settings = loadSettings();
        document.documentElement.style.setProperty('--metro-accent', state.settings.accent);
        document.documentElement.dataset.theme = state.settings.theme;

        const topbar = `
          <header class="topbar">
            <div class="brand" id="go-home">
              <div class="brand-mark">N</div>
              <div>
                <div class="brand-name">NexSearch</div>
                <small>Recherche visuelle</small>
              </div>
            </div>

            <div class="search-col">
              <div class="search-shell">
                <div class="search-icon">⌕</div>
                <input type="text" id="search-input" value="${escapeHtml(state.query)}" placeholder="Rechercher..." />
                <button type="button" id="search-button">Rechercher</button>
              </div>

              <div class="search-tabs">
                ${['web','images','news'].map(tab => `
                  <button type="button" class="tab ${state.type === tab ? 'active' : ''}" data-tab="${tab}">
                    ${tab === 'web' ? 'Web' : tab === 'images' ? 'Images' : 'Actualités'}
                  </button>
                `).join('')}
              </div>

              ${state.suggestions.length ? `
                <div class="suggestions">
                  ${state.suggestions.map(item => `
                    <button type="button" data-suggest="${escapeHtml(item)}">${escapeHtml(item)}</button>
                  `).join('')}
                </div>
              ` : ''}
            </div>

            <div class="top-actions">
              <button type="button" class="settings-button" id="settings-toggle">Paramètres</button>
            </div>
          </header>
        `;

        const content = state.route === 'home' ? renderHome() : renderResultsPage();

        document.getElementById('app').innerHTML = `
          ${topbar}
          ${content}
          ${renderSettingsPanel()}
        `;

        bindEvents();
      }

      function bindEvents() {
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
          searchInput.oninput = async (e) => {
            const value = e.target.value;
            state.query = value;
            if (!value.trim()) {
              state.suggestions = [];
              render();
              return;
            }
            const suggestions = await fetchSuggestions(value);
            state.suggestions = suggestions;
            render();
          };

          searchInput.onkeydown = (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              doSearch(state.query, state.type);
            }
          };
        }

        document.getElementById('search-button')?.addEventListener('click', () => {
          doSearch(state.query, state.type);
        });

        document.querySelectorAll('[data-tab]').forEach(btn => {
          btn.addEventListener('click', () => {
            const tab = btn.getAttribute('data-tab');
            if (!tab) return;
            state.type = tab;
            if (state.route === 'search') {
              doSearch(state.query, state.type);
            } else {
              state.query = tab === 'web' ? '' : 'recherche';
              render();
            }
          });
        });

        document.querySelectorAll('[data-suggest]').forEach(btn => {
          btn.addEventListener('click', () => {
            const val = btn.getAttribute('data-suggest');
            if (!val) return;
            state.query = val;
            doSearch(val, state.type);
          });
        });

        document.getElementById('go-home')?.addEventListener('click', () => {
          state.route = 'home';
          render();
        });

        document.querySelectorAll('[data-tile]').forEach(btn => {
          btn.addEventListener('click', () => {
            const label = btn.getAttribute('data-tile');
            if (!label) return;
            if (label === 'Historique') {
              const historyValue = state.settings.history[0] || 'historique';
              doSearch(historyValue, 'web');
              return;
            }
            if (label === 'Actualités') {
              doSearch('actualités du jour', 'news');
              return;
            }
            if (label === 'Météo') {
              doSearch('météo locale', 'web');
              return;
            }
            if (label === 'Explorer') {
              doSearch('explorer', 'web');
              return;
            }
            if (label === 'IA overview') {
              doSearch('intelligence artificielle', 'web');
              return;
            }
            doSearch(label, 'web');
          });
        });

        document.getElementById('settings-toggle')?.addEventListener('click', () => {
          state.settingsOpen = !state.settingsOpen;
          render();
        });

        document.getElementById('close-settings')?.addEventListener('click', () => {
          state.settingsOpen = false;
          render();
        });

        document.getElementById('toggle-theme')?.addEventListener('click', () => {
          updateTheme(state.settings.theme === 'dark' ? 'light' : 'dark');
          render();
        });

        document.getElementById('toggle-ai')?.addEventListener('click', () => {
          state.settings.aiEnabled = !state.settings.aiEnabled;
          saveSettings();
          render();
        });

        document.getElementById('clear-history')?.addEventListener('click', () => {
          state.settings.history = [];
          saveSettings();
          render();
        });

        document.querySelectorAll('[data-accent]').forEach(btn => {
          btn.addEventListener('click', () => {
            const color = btn.getAttribute('data-accent');
            if (color) {
              updateAccent(color);
              state.settingsOpen = false;
              render();
            }
          });
        });

        document.querySelectorAll('[data-history]').forEach(btn => {
          btn.addEventListener('click', () => {
            const value = btn.getAttribute('data-history');
            if (value) doSearch(value, 'web');
          });
        });

        document.getElementById('settings-backdrop')?.addEventListener('click', (e) => {
          if (e.target && e.target.id === 'settings-backdrop') {
            state.settingsOpen = false;
            render();
          }
        });

        document.querySelectorAll('[data-tab]').forEach(btn => {
          btn.onclick = () => {
            const t = btn.getAttribute('data-tab');
            if (t) {
              state.type = t;
              if (state.route === 'search') {
                doSearch(state.query, t);
              } else {
                render();
              }
            }
          };
        });
      }

      async function doSearch(value, type = 'web') {
        const q = String(value || '').trim();
        if (!q) return;
        state.query = q;
        state.type = type;
        state.route = 'search';
        state.loading = true;
        render();

        const data = await fetchSearchData(q, type);
        state.results = data;
        addHistory(q);
        state.loading = false;
        render();

        const params = new URLSearchParams({ q, type });
        const url = new URL(window.location.href);
        url.search = params.toString();
        window.history.replaceState({}, '', url);
      }

      function bootstrap() {
        ensureSettings();
        state.settings = loadSettings();
        updateAccent(state.settings.accent);
        updateTheme(state.settings.theme);

        const params = new URLSearchParams(window.location.search);
        const q = params.get('q') || '';
        const type = (params.get('type') || 'web').toLowerCase();

        if (q) {
          state.query = q;
          state.type = ['web', 'images', 'news'].includes(type) ? type : 'web';
          state.route = 'search';
          state.loading = true;
          render();

          fetchSearchData(q, state.type).then(data => {
            state.results = data;
            state.loading = false;
            render();
          });
        } else {
          state.weather = { temp: 19, label: 'Nuageux', city: 'Paris' };
          render();
        }

        getWeather().then(w => {
          state.weather = w;
          render();
        });
      }

      bootstrap();
    </script>
  </body>
</html>
